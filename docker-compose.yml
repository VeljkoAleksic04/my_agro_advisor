services:
  postgres:
    image: postgres:16-alpine
    container_name: agroplatforma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_pass
      POSTGRES_DB: agroplatforma
    ports:
      - "5432:5432"
    volumes:
      - agroplatforma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_user -d agroplatforma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agroplatforma_pgdata:
