<section class="stranica-auth">
  <form [formGroup]="forma" (ngSubmit)="posalji()" class="karta forma-auth">
    <h1>Prijava</h1>
    <p class="podnaslov">Prijavite se na svoj AgroPlatforma nalog.</p>

    <div class="polje">
      <label for="username">Korisničko ime</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />
    </div>

    <div class="polje">
      <label for="password">Lozinka</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    @if (greska()) {
      <p class="poruka-greske">{{ greska() }}</p>
    }

    <button type="submit" class="dugme dugme-primarni" [disabled]="ucitavanje()">
      {{ ucitavanje() ? 'Prijavljivanje...' : 'Prijavi se' }}
    </button>

    <p class="tekst-podnozje">
      Nemate nalog? <a routerLink="/registracija">Registrujte se</a>
    </p>
  </form>
</section>
