<section class="stranica-auth">
  <form [formGroup]="forma" (ngSubmit)="posalji()" class="karta forma-auth">
    <h1>Registracija</h1>
    <p class="podnaslov">Kreirajte nalog i počnite da vodite evidenciju svojih parcela.</p>

    <div class="polje-red">
      <div class="polje">
        <label for="ime">Ime</label>
        <input id="ime" type="text" formControlName="ime" autocomplete="given-name" />
      </div>
      <div class="polje">
        <label for="prezime">Prezime</label>
        <input id="prezime" type="text" formControlName="prezime" autocomplete="family-name" />
      </div>
    </div>

    <div class="polje">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="polje">
      <label for="datumRodjenja">Datum rođenja</label>
      <input id="datumRodjenja" type="date" formControlName="datumRodjenja" />
    </div>

    <div class="polje">
      <label for="username">Korisničko ime</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />
    </div>

    <div class="polje">
      <label for="password">Lozinka</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
    </div>

    @if (greska()) {
      <p class="poruka-greske">{{ greska() }}</p>
    }

    <button type="submit" class="dugme dugme-primarni" [disabled]="ucitavanje()">
      {{ ucitavanje() ? 'Kreiranje naloga...' : 'Registruj se' }}
    </button>

    <p class="tekst-podnozje">
      Već imate nalog? <a routerLink="/prijava">Prijavite se</a>
    </p>
  </form>
</section>
