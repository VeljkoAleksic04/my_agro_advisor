<div class="profil-lejaut">
  <header class="profil-zaglavlje">
    <a routerLink="/" class="logo">🌾 <span>MAS</span></a>

    <div class="zaglavlje-akcije">
      <button type="button" class="dugme-tema" (click)="promeniTemu()">
        {{ temaServis.tema() === 'tamna' ? 'Light theme' : 'Dark theme' }}
      </button>
      <app-forum-indikator />
      <app-obavestenja />
      @if (korisnik(); as k) {
        <span class="korisnik-oznaka">{{ k.username }}</span>
      }
      <app-korisnik-meni [korisnik]="korisnik()" (odjava)="odjaviSe()" />
    </div>
  </header>

  <div class="profil-telo">
    <aside class="bocna-traka">
      <nav>
        <a routerLink="/profil/dashboard" routerLinkActive="aktivan">Dashboard</a>
        <a routerLink="/profil/places" routerLinkActive="aktivan">Parcele</a>
        <a routerLink="/profil/istorija" routerLinkActive="aktivan">History</a>
        <a routerLink="/profil/statistika" routerLinkActive="aktivan">Statistics</a>
        <a routerLink="/profil/chat" routerLinkActive="aktivan" class="chat-link">
          Chat @if (chatNotifikacije.brojNeprocitanih() > 0) 
          {
            <span class="chat-broj">{{ chatNotifikacije.brojNeprocitanih() }}</span>
          }
        </a>
      </nav>
    </aside>

    <main class="profil-sadrzaj">
      <router-outlet />
    </main>
  </div>
</div>
